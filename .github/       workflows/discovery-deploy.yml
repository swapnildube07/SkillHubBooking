name: Deploy Discovery Service

on:
  push:
    branches: 
      - main
    paths:
      - 'Discover-Service/**'
      - '.github/workflows/discovery-deploy.yml'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Discover-Service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Project
        run: mvn -B package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "Discover-Service/target/*.jar"
          target: "/home/ubuntu/SkillHub/discovery-service"

      - name: Restart App on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            pkill -f "discovery-service" || true
            nohup java -jar /home/ubuntu/SkillHub/discovery-service/*.jar > output.log 2>&1 &
